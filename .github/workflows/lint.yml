name: Lint and Style Checks

on:
  push:
    branches: [ main, REL1_43, REL1_39 ]
  pull_request:
    branches: [ main, REL1_43, REL1_39 ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run PHP lint
        run: vendor/bin/parallel-lint . --exclude vendor --exclude node_modules
      # Errors fail the build. Warnings do not: the codebase sits at 0 errors and
      # 2 known warnings in test stubs, so `|| true` here (which this step used to
      # have) meant a regression to any number of phpcs errors would still go
      # green. A check that cannot fail is not a check.
      - name: Run PHPCS (errors fail, warnings allowed)
        run: vendor/bin/phpcs -sp --cache --warning-severity=0

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm install
      - name: Run ESLint
        run: npm test
