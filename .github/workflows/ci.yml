name: CI

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main, REL1_43, REL1_39 ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies (Composer)
        run: |
          if [ -f composer.json ]; then composer install --no-interaction --no-progress; fi

      - name: Install dependencies (npm)
        run: npm ci

      - name: Version consistency check
        run: node scripts/update-version.js --check

      - name: Lint/i18n (grunt)
        run: npm test

      - name: PHP checks
        run: npm run test:php

      - name: PHP unit tests (PHPUnit)
        run: npm run test:phpunit

      - name: JS unit tests (Jest)
        run: npm run test:js

      # Runtime dependencies are what ships to a wiki, so a high/critical
      # advisory there fails the build. Dev-only advisories are reported into the
      # job summary instead of being discarded — the previous `|| true` on both
      # meant a new vulnerability was scanned for and then thrown away.
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (dev dependencies, advisory)
        if: always()
        run: |
          echo '### npm audit (dev, advisory)' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=moderate >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: composer audit (advisory)
        if: always()
        run: |
          echo '### composer audit (advisory)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f composer.json ]; then
            composer audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi
