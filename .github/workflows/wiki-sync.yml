name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync wiki files
        run: |
          (cd main-repo && node scripts/verify-docs.js)
          # Keep remote-only pages/assets. Page removals require explicit review.
          for page in main-repo/wiki/*.md; do
            [ "$(basename "$page")" = "README.md" ] && continue
            cp "$page" wiki-repo/
          done
          
          # Show what changed
          cd wiki-repo
          # Remove only the obsolete published copy of our repository-only guide.
          git rm --ignore-unmatch -- README.md
          git status

      - name: Commit and push changes
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          git add -- '*.md'
          if git diff --staged --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          
          git commit -m "Sync wiki from main repository
          
          Source commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}"
          git push
