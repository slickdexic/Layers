name: God Class Growth Prevention

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'resources/**/*.js'

jobs:
  check-god-classes:
    runs-on: ubuntu-latest
    name: Prevent God Class Growth
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check total codebase size
        run: |
          echo "📊 Checking total JavaScript codebase size..."
          echo ""
          
          # Total line count thresholds. The project target is <110,000 lines of
          # JavaScript (see .github/copilot-instructions.md). These were left at
          # 45,000/50,000 long after the codebase passed them, so this job failed
          # on every pull request and the signal was ignored.
          WARN_TOTAL=108000
          BLOCK_TOTAL=110000
          
          TOTAL_LINES=$(find resources -name "*.js" -type f ! -path "*/dist/*" ! -path "*backup*" -exec cat {} \; | wc -l | tr -d ' ')
          
          echo "Total JavaScript lines: $TOTAL_LINES"
          echo ""
          
          if [ "$TOTAL_LINES" -gt "$BLOCK_TOTAL" ]; then
            echo "❌ CODEBASE TOO LARGE: $TOTAL_LINES lines exceeds $BLOCK_TOTAL limit"
            echo ""
            echo "Action required:"
            echo "1. Extract shared logic to common utilities"
            echo "2. Remove unused code"
            echo "3. Consider lazy loading or code splitting"
            exit 1
          elif [ "$TOTAL_LINES" -gt "$WARN_TOTAL" ]; then
            echo "⚠️ WARNING: Codebase approaching limit ($TOTAL_LINES / $BLOCK_TOTAL lines)"
            echo ""
            echo "Consider refactoring to reduce total size."
          else
            echo "✅ Codebase size OK: $TOTAL_LINES lines (limit: $BLOCK_TOTAL)"
          fi

      - name: Check for god class growth
        run: |
          echo "🔍 Checking for god class growth..."
          echo ""
          
          # Baselines are current line counts - PRs must not increase them.
          # Refreshed 2026-09-02; the previous set was from 2025-12-20 and every
          # entry had been exceeded, so this job could only ever fail.
          # Generated data files are exempt by policy and are skipped below.
          declare -A GOD_CLASSES=(
            ["resources/ext.layers.editor/LayerPanel.js"]=2177
            ["resources/ext.layers.editor/CanvasManager.js"]=2145
            ["resources/ext.layers.editor/Toolbar.js"]=2091
            ["resources/ext.layers.editor/LayersEditor.js"]=2014
            ["resources/ext.layers.editor/ui/PropertyBuilders.js"]=1976
            ["resources/ext.layers.editor/canvas/InlineTextEditor.js"]=1864
            ["resources/ext.layers/viewer/LayersLightbox.js"]=1772
            ["resources/ext.layers.editor/APIManager.js"]=1702
            ["resources/ext.layers.editor/SelectionManager.js"]=1491
            ["resources/ext.layers/viewer/ViewerManager.js"]=1333
            ["resources/ext.layers.editor/CanvasRenderer.js"]=1246
            ["resources/ext.layers.editor/canvas/TransformController.js"]=1234
            ["resources/ext.layers/viewer/SlideController.js"]=1183
            ["resources/ext.layers.editor/ToolbarStyleControls.js"]=1141
            ["resources/ext.layers.shared/TextBoxRenderer.js"]=1128
            ["resources/ext.layers.editor/canvas/ResizeCalculator.js"]=1073
            ["resources/ext.layers.shared/AngleDimensionRenderer.js"]=1067
            ["resources/ext.layers.editor/canvas/DrawingController.js"]=1064
            ["resources/ext.layers.editor/CanvasEvents.js"]=1038
            ["resources/ext.layers.shared/CalloutRenderer.js"]=1003
          )

          # Generated data files - size is a function of the source data, not of
          # code structure, so growth here is not technical debt.
          GENERATED_RE='shapeLibrary/(ShapeLibraryData|EmojiLibraryIndex)'
          
          WARN_THRESHOLD=800
          BLOCK_THRESHOLD=1000
          
          FAILED=0
          WARNINGS=""
          BLOCKS=""
          IMPROVEMENTS=""
          
          for file in "${!GOD_CLASSES[@]}"; do
            baseline=${GOD_CLASSES[$file]}
            
            if [ -f "$file" ]; then
              current=$(wc -l < "$file" | tr -d ' ')
              
              if [ "$current" -gt "$baseline" ]; then
                growth=$((current - baseline))
                BLOCKS+="❌ BLOCKED: $file grew from $baseline to $current lines (+$growth)\n"
                FAILED=1
              elif [ "$current" -lt "$baseline" ]; then
                reduction=$((baseline - current))
                IMPROVEMENTS+="✅ IMPROVED: $file reduced from $baseline to $current lines (-$reduction)\n"
              else
                WARNINGS+="➖ UNCHANGED: $file remains at $current lines\n"
              fi
            fi
          done
          
          # Check for NEW god classes (any file >1000 lines not in baseline)
          echo "🔍 Checking for new god classes..."
          while IFS= read -r file; do
            lines=$(echo "$file" | awk '{print $1}')
            filepath=$(echo "$file" | awk '{print $2}')
            
            # Skip generated data files
            if echo "$filepath" | grep -Eq "$GENERATED_RE"; then
              continue
            fi

            # Skip if it's already tracked
            is_tracked=0
            for known in "${!GOD_CLASSES[@]}"; do
              if [ "$known" == "$filepath" ]; then
                is_tracked=1
                break
              fi
            done
            
            if [ $is_tracked -eq 0 ] && [ "$lines" -gt "$BLOCK_THRESHOLD" ]; then
              BLOCKS+="❌ NEW GOD CLASS: $filepath has $lines lines (max $BLOCK_THRESHOLD for new files)\n"
              FAILED=1
            elif [ $is_tracked -eq 0 ] && [ "$lines" -gt "$WARN_THRESHOLD" ]; then
              WARNINGS+="⚠️ WARNING: $filepath has $lines lines (approaching $BLOCK_THRESHOLD limit)\n"
            fi
          done < <(find resources -name "*.js" -type f ! -path "*/dist/*" ! -path "*backup*" -exec wc -l {} \; | sort -rn)
          
          echo "=========================================="
          echo "GOD CLASS GROWTH PREVENTION REPORT"
          echo "=========================================="
          echo ""
          
          if [ -n "$BLOCKS" ]; then
            echo "🚫 BLOCKING ISSUES:"
            echo -e "$BLOCKS"
            echo ""
          fi
          
          if [ -n "$IMPROVEMENTS" ]; then
            echo "🎉 IMPROVEMENTS:"
            echo -e "$IMPROVEMENTS"
            echo ""
          fi
          
          if [ -n "$WARNINGS" ]; then
            echo "📋 STATUS:"
            echo -e "$WARNINGS"
          fi
          
          echo ""
          echo "=========================================="
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ BUILD FAILED: God class growth detected!"
            echo ""
            echo "To fix this:"
            echo "1. Extract code from the growing file into a new, smaller module"
            echo "2. Or refactor to reduce the file size"
            echo "3. Do NOT increase god class sizes"
            echo ""
            echo "See: improvement_plan.md for refactoring guidance"
            echo "See: docs/PROJECT_GOD_CLASS_REDUCTION.md for context"
            exit 1
          else
            echo ""
            echo "✅ All god class checks passed!"
            echo ""
            echo "Tip: Help reduce technical debt by extracting code from god classes."
            echo "Tracked god classes: ${#GOD_CLASSES[@]} files"
          fi

      - name: Summary
        if: always()
        run: |
          TOTAL_LINES=$(find resources -name "*.js" -type f ! -path "*/dist/*" ! -path "*backup*" -exec cat {} \; | wc -l | tr -d ' ')
          
          echo "## Code Growth Prevention Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Codebase Size" >> $GITHUB_STEP_SUMMARY
          echo "- **Current:** $TOTAL_LINES lines" >> $GITHUB_STEP_SUMMARY
          echo "- **Warning threshold:** 108,000 lines" >> $GITHUB_STEP_SUMMARY
          echo "- **Block threshold:** 110,000 lines" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### God Class Check" >> $GITHUB_STEP_SUMMARY
          echo "This check prevents god classes (files >1,000 lines) from growing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Current god classes (9 files) - December 2025:**" >> $GITHUB_STEP_SUMMARY
          echo "- CanvasManager.js (1,805 lines) - ✅ facade, delegates to 10+ controllers" >> $GITHUB_STEP_SUMMARY
          echo "- LayerPanel.js (1,720 lines) - ✅ delegates to 7 controllers" >> $GITHUB_STEP_SUMMARY
          echo "- LayersEditor.js (1,325 lines) - partial delegation" >> $GITHUB_STEP_SUMMARY
          echo "- ToolManager.js (1,275 lines) - ✅ delegates to 2 handlers" >> $GITHUB_STEP_SUMMARY
          echo "- APIManager.js (1,168 lines) - has APIErrorHandler delegation" >> $GITHUB_STEP_SUMMARY
          echo "- SelectionManager.js (1,147 lines) - ✅ delegates to 3 modules" >> $GITHUB_STEP_SUMMARY
          echo "- Toolbar.js (1,115 lines) - partial delegation" >> $GITHUB_STEP_SUMMARY
          echo "- ToolbarStyleControls.js (1,095 lines) - has ColorControlFactory delegation" >> $GITHUB_STEP_SUMMARY
          echo "- ShapeRenderer.js (1,049 lines) - has ShadowRenderer delegation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See [improvement_plan.md](improvement_plan.md) for remediation roadmap." >> $GITHUB_STEP_SUMMARY
