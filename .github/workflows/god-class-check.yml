name: JavaScript code growth

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'resources/**/*.js'
      - 'scripts/check-code-growth.js'
      - 'scripts/code-growth-baseline.json'
      - 'scripts/tests/check-code-growth.test.js'
      - 'package.json'
      - '.github/workflows/god-class-check.yml'

jobs:
  check-code-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the growth guard
        run: node --test scripts/tests/check-code-growth.test.js
      - name: Check maintained JavaScript
        run: npm run check:code-growth
